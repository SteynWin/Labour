<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Labour Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header no-print">
  <div class="header-inner">
    <img src="assets/logo.png" alt="" class="app-logo">
    <div class="header-text">
      <h1>Weekly Labour Planner</h1>
      <p class="subtitle">Allocate employers to jobs for each work day</p>
    </div>
  </div>
</header>

<main class="container">

  <!-- WEEK SELECTOR -->
  <section class="card no-print">
    <div class="week-select-row">
      <label for="weekStart">Week starting (Monday)</label>
      <input type="date" id="weekStart">
      <span class="week-range" id="weekRangeLabel"></span>
    </div>
  </section>

  <!-- INPUT: add one task at a time -->
  <section class="card no-print" id="inputCard">
    <h2 class="card-title">Add a Task</h2>
    <form id="entryForm">
      <div class="input-row">

        <div class="field-box">
          <label for="dateSelect">Date</label>
          <select id="dateSelect"></select>
        </div>

        <div class="field-box">
          <label for="jobSelect">Job</label>
          <select id="jobSelect"></select>
          <div class="field-box-actions">
            <button type="button" id="jobAddBtn">+ Add</button>
            <button type="button" id="jobDelBtn">&minus; Delete</button>
          </div>
        </div>

        <div class="field-box">
          <label>Employer(s)</label>
          <div class="checkbox-list" id="employerCheckList"></div>
          <div class="field-box-actions">
            <button type="button" id="empAddBtn">+ Add</button>
          </div>
        </div>

        <div class="field-box field-box-task">
          <label for="taskInput">Task</label>
          <textarea id="taskInput" rows="2" placeholder="What needs to be done?"></textarea>
        </div>

      </div>

      <div class="input-form-footer">
        <div id="entryErrors" class="form-errors" role="alert"></div>
        <button type="submit" class="primary-btn">+ Add to Plan</button>
      </div>
    </form>
  </section>

  <!-- RESULTS: live, grouped by day -->
  <section id="resultsSection">
    <div class="actions-bar no-print">
      <h2 class="card-title">Weekly Plan</h2>
      <button type="button" id="exportBtn" class="primary-btn">Export as PDF</button>
    </div>

    <div id="printArea" class="print-area">
      <div class="print-header">
        <img src="assets/logo.png" alt="" class="print-logo">
        <h1>Weekly Labour Plan</h1>
        <p id="resultsWeekRange" class="print-subtitle"></p>
      </div>
      <div id="resultsBody"></div>
    </div>
  </section>

</main>

<footer class="app-footer no-print">
  <p>Data is stored locally in your browser. Nothing is uploaded anywhere.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
